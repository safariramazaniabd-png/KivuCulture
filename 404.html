<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — KIVU Culture</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#141008;color:#F5EDD8;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
  .c{max-width:400px}
  h1{font-size:5rem;font-weight:800;letter-spacing:-0.03em;color:#B8924A;line-height:1}
  p{font-size:1rem;color:rgba(245,237,216,0.6);margin:16px 0 32px;line-height:1.6}
  a{display:inline-block;background:#B8924A;color:#141008;padding:12px 32px;border-radius:8px;text-decoration:none;font-weight:600;transition:background .2s}
  a:hover{background:#D4AA62}
  .dot{width:8px;height:8px;background:#B8924A;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="c">
  <h1>404</h1>
  <p>Cette page n'existe pas ou a été déplacée. Le Kivu est vaste, mais pas infini.</p>
  <a href="/"><span class="dot"></span>Retour à l'accueil</a>
</div>
</body>
</html>
